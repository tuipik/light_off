[pytest]
# Де шукати тести
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Опції за замовчуванням
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Маркери для груп тестів
markers =
    slow: позначає повільні тести (інтеграційні)
    unit: юніт тести
    integration: інтеграційні тести
    redis: тести що потребують Redis

# Ігнорувати попередження
filterwarnings =
    ignore::DeprecationWarning