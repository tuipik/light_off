services:
  redis:
    image: redis:7.2-alpine
    container_name: light_off_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  light_off:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: light_off_service
    restart: unless-stopped
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - ALERT_TELEGRAM_CHAT_ID=${ALERT_TELEGRAM_CHAT_ID:-}
      - YOUR_QUEUE=${YOUR_QUEUE:-GPV3.2}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-20}
      - CHECK_INTERVAL_JITTER_PERCENT=${CHECK_INTERVAL_JITTER_PERCENT:-30}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMEZONE=${TIMEZONE:-Europe/Kyiv}
      - PLAYWRIGHT_BROWSER=${PLAYWRIGHT_BROWSER:-chromium}
      - PLAYWRIGHT_PROFILE_DIR=/app/pw_profile
      - PLAYWRIGHT_HEADLESS=${PLAYWRIGHT_HEADLESS:-1}
      - PLAYWRIGHT_USER_AGENT=${PLAYWRIGHT_USER_AGENT:-}
      - AUTO_HEADFUL_ON_BLOCK=${AUTO_HEADFUL_ON_BLOCK:-1}
      - MAX_BACKOFF_MINUTES=${MAX_BACKOFF_MINUTES:-60}
      - MIN_BLOCK_BACKOFF_MINUTES=${MIN_BLOCK_BACKOFF_MINUTES:-60}
      - DEGRADED_MIN_MINUTES=${DEGRADED_MIN_MINUTES:-120}
      - DEGRADED_MAX_MINUTES=${DEGRADED_MAX_MINUTES:-360}
      - BLOCK_ALERT_COOLDOWN_MINUTES=${BLOCK_ALERT_COOLDOWN_MINUTES:-360}
      - PLAYWRIGHT_GOTO_TIMEOUT_MS=${PLAYWRIGHT_GOTO_TIMEOUT_MS:-60000}
      - DTEK_COOKIE
    command: /app/start.sh
    volumes:
      - pw_profile:/app/pw_profile

volumes:
  redis_data:
  pw_profile:
