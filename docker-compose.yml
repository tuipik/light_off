services:
  redis:
    image: redis:7.2-alpine
    container_name: light_off_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data

  light_off:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: light_off_service
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - YOUR_QUEUE=${YOUR_QUEUE:-GPV3.2}
      - CHECK_INTERVAL_MINUTES=${CHECK_INTERVAL_MINUTES:-20}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - TIMEZONE=${TIMEZONE:-Europe/Kyiv}
    command: python main.py

volumes:
  redis_data:
